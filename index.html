<body>
<center> <!-- afaik it's bad practice to use <center> in 2025, but I couldn't find any other way -->
<div class="box">

</div>
<div class="">

    height="140">
</div>

<div class="">
    <p>Welcome to Yippe! Search!</p>
</div>

<form action="./search.html" method="get" class="query">

    <input
    type="query"
    id="query"
    name="query"
    required
    maxlength="256"
    size="50"
    >
    <br> <br>
    <input
    type="submit"
    value="Search!"
    >
    <button
    class="lucky"
    type="button"
    disabled
    >I'm feeling lucky
    </button>

</form>
</center>
