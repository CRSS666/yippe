<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yippe! Search</title>

    <!-- Discord and co. meta stuff -->

    <meta content="Yippe! Search" property="og:title" />
    <meta content="Find anything and everything all of the time in the CRSSi." property="og:description" />
    <meta content="https://yippe.crssi.cc/" property="og:url" />
    <meta content="https://github.com/CRSS666/yippe/blob/img/branding/png/illustrator/512h/yippe!_bg.png?raw=true" property="og:image" />
    <meta content="#ffffff" data-react-helmet="true" name="theme-color" />
    <meta name="twitter:card" content="summary_large_image">

    <!-- end of meta stuff :3c      -->

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <center> <!-- afaik it's bad practice to use <center> in 2025, but I couldn't find any other way -->
        <div class="nullbox">
        
        </div>
        <div class="">
            <img src="/img/branding/yippe!_search.svg"
            height="140">
        </div>

        <div class="">
            <p>
            Welcome to Yippe! Search!<br>
            <i>Find anything and everything, all of the time!</i>
            </p>
        </div>

        <form action="./search.html" method="get" class="search" accept-charset="UTF-8">
        
            <input
            type="search"
            id="search"
            name="q"
            required
            maxlength="256"
            size="50"
            placeholder="Search the CRSSi..."
            required
            >
            <br> <br>
            <input
            type="submit"
            value="Search!"
            >
            <button
            class="lucky"
            type="button"
            disabled
            >I'm feeling lucky
            </button>
        
        </form>
    <br>
    <!-- <center> -->
    <footer>
        <p>
            © 2025 Yippe! (CRSS) - All Rights Reserved
        </p>
        <p><i>
            You are allowed to fork, alter, and publish your own version of Yippe!
            Search, as long as you remove all mentions to Yippe!'s Branding.
        </i></p>
        <p>
            <a href="about.html">About</a> · 
            <a href="https://github.com/crss666/yippe/" target="_blank">Source Code</a> · 
            <a href="https://crssi.cc" target="_blank">Click me!</a>
        </p>
    </footer>
    </center>
</body>
</html>
