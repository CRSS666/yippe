<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yippe! Search - Results</title>

    <!-- Discord and co. meta stuff -->

    <meta content="Yippe! Search - Results" property="og:title" />
    <meta content=
    "Find anything and everything all of the time in the CRSSi.
    This link already has a search query attached, but we don't have the tech to show you results in an embed."
    property="og:description" />
    <meta content="https://yippe.crssi.cc/" property="og:url" />
    <meta content="https://github.com/CRSS666/yippe/blob/img/branding/png/illustrator/512h/yippe!_bg.png?raw=true" property="og:image" />
    <meta content="#ffffff" data-react-helmet="true" name="theme-color" />
    <meta name="twitter:card" content="summary_large_image">

    <!-- end of meta stuff :3c      -->

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <style>
        
        body, html {
            height: 100%;
            margin: 0%;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
        }
        main {
            flex: 1;
        }
        .topbar {
            width: auto;
            height: 60px;
            background-color: #eee;
            display: flex;
            align-items: center;
            padding: 0 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            gap: 10px;
        }
        .topbar img {
            height: 45px;
        }
        .topbar form {
            display: flex;
            gap: 5px;
        }
        .topbar input[type="search"] {
            width: 250px;
            padding: 5px;
        }
        .topbar input[type="submit"] {
            padding: 5px 10px;
        }
        .results {
            margin: 5px;
            gap: 5px;
        }
        footer {
            padding: 15px;
            background-color: #eee;
            font-size: 0.9em;
        }

    </style>

</head>
<body>
    <div class="topbar">
        <a href="./index.html">
        <img
        src="/img/branding/yippe!_search.svg">
        </a>
        <form action="" method="get" accept-charset="UTF-8">

            <input
            type="search"
            id="search"
            name="q"
            required
            maxlength="256"
            size="25"
            placeholder="Search the CRSSi..."
            required
            >
            <input
            type="submit"
            value="Search!"
            >
            
        </form>
        <i>Find anything and everything, all of the time!</i>
    </div>
    <div id="rlist" class="results"></div>
    <script>
            async function runSearch() {

                const params = new URLSearchParams(window.location.search)
                const query = params.get("q");

                if (!query) return; 
                
                const res = await fetch("index.json");
                const sites = await res.json();

                const keywords = query.toLocaleLowerCase().split(/\s+/); // no wonder it was breaking on multiple words...

                const results = sites.filter(site => {
                    const haystack = (site.title + " " + site.url + " " + site.desc).toLocaleLowerCase();
                    return keywords.every (word => haystack.includes(word)); },

                );

                const list = document.getElementById("rlist")
                list.innerHTML = "";

                if (results.length === 0) {
                    list.innerHTML = "<p>No results found! Showing all available websites...<p>";
                    sites.forEach(site => {
                        const div = document.createElement("div");
                        div.className = "ritem";
                        div.innerHTML = `
                            <h3><a href="${site.url}">${site.title}</a></h3>
                            <div class="url"><h5>${site.url}/</h5></div>
                            <p>${site.desc}</p>
                            <hr>
                    `;
                    list.appendChild(div);
                });
                    // did code here now
                } else {
                    results.forEach(site => {
                        const div = document.createElement("div");
                        div.className = "ritem";
                        div.innerHTML = `
                            <h3><a href="${site.url}">${site.title}</a></h3>
                            <div class="url"><h5>${site.url}/</h5></div>
                            <p>${site.desc}</p>
                            <hr>
                    `;
                    list.appendChild(div);
                    });            
                }
            }
            
            runSearch();
    </script>

    <center>
    <footer>
        <p>
            © 2025 Yippe! (CRSS) - All Rights Reserved
        </p>
        <p><i>
            You are allowed to fork, alter, and publish your own version of Yippe!
            Search, as long as you remove all mentions to Yippe!'s Branding.
        </i></p>
        <p>
            <a href="about.html">About</a> · 
            <a href="https://github.com/crss666/yippe/" target="_blank">Source Code</a> · 
            <a href="https://crssi.cc" target="_blank">Click me!</a>
        </p>
    </footer>
    </center>

</body>
</html>
