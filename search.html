<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yippe! Search - Results</title>

    <!-- Discord and co. meta stuff -->

    <meta content="Yippe! Search - Results" property="og:title" />
    <meta content=
    "Find anything and everything all of the time in the CRSSi.
    This link already has a search query attached, but we don't have the tech to show you results in an embed."
    property="og:description" />
    <meta content="https://yippe.crssi.cc/" property="og:url" />
    <meta content="https://github.com/CRSS666/yippe/blob/img/branding/yippe_search_transparent.png?raw=true" property="og:image" />
    <meta content="#ffffff" data-react-helmet="true" name="theme-color" />
    <meta name="twitter:card" content="summary_large_image">

    <!-- end of meta stuff :3c      -->

    <style>
        
        body, html {
            margin: 0;
            padding: 0;
        }
        .topbar {
            width: 100%;
            height: 60px;
            background-color: #eee;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }
        .topbar img {
            height: 45px;
        }
        .topbar form {
            display: flex;
            gap: 5px;
        }
        .topbar input[type="search"] {
            width: 250px;
            padding: 5px;
        }
        .topbar input[type="submit"] {
            padding: 5px 10px;
        }
        .results {
            margin: 5px;
            gap: 5px;
        }

    </style>

</head>
<body>
    <div class="topbar">
        <a href="./index.html">
        <img
        src="https://github.com/CRSS666/yippe/blob/img/branding/yippe_beta_transparent.png?raw=true">
        </a>
        <form action="" method="get" accept-charset="UTF-8">

            <input
            type="search"
            id="search"
            name="q"
            required
            maxlength="256"
            size="25"
            placeholder="Search the CRSSi..."
            required
            >
            <input
            type="submit"
            value="Search!"
            >
            
        </form>
    </div>
    <div id="rlist" class="results"></div>
    <script>
            async function runSearch() {

                const params = new URLSearchParams(window.location.search)
                const query = params.get("q");

                if (!query) return; 
                
                const res = await fetch("index.json");
                const sites = await res.json();

                const keywords = query.toLocaleLowerCase().split(/\s+/); // no wonder it was breaking on multiple words...

                const results = sites.filter(site => {
                    const haystack = (site.title + " " + site.url + " " + site.desc).toLocaleLowerCase();
                    return keywords.every (word => haystack.includes(word)); },

                );

                const list = document.getElementById("rlist")
                list.innerHTML = "";

                if (results.length === 0) {
                    list.innerHTML = "<p>No results found! Showing all available websites...<p>";
                    sites.forEach(site => {
                        const div = document.createElement("div");
                        div.className = "ritem";
                        div.innerHTML = `
                            <h3><a href="${site.url}">${site.title}</a></h3>
                            <div class="url"><h5>${site.url}/</h5></div>
                            <p>${site.desc}</p>
                            <hr>
                    `;
                    list.appendChild(div);
                });
                    // did code here now
                } else {
                    results.forEach(site => {
                        const div = document.createElement("div");
                        div.className = "ritem";
                        div.innerHTML = `
                            <h3><a href="${site.url}">${site.title}</a></h3>
                            <div class="url"><h5>${site.url}/</h5></div>
                            <p>${site.desc}</p>
                            <hr>
                    `;
                    list.appendChild(div);
                    });            
                }
            }
            
            runSearch();
    </script>
</body>
</html>
